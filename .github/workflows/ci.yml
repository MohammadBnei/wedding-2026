name: ci

on:
  pull_request:
  push:
    branches: [main]
    # Same list as release.yml's, so the two stay in step: a push that cuts no
    # release runs no ci either. Mainly this stops release-it's own release
    # commit from spending a postgres + playwright run on a version bump.
    paths-ignore:
      - '*.md'
      - '**.yml'
      - '**.yaml'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weddingdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      WEDDING_DB_HOST: localhost
      WEDDING_DB_PORT: '5432'
      WEDDING_DB_NAME: weddingdb
      WEDDING_DB_USER: postgres
      WEDDING_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check         # svelte-check; jsconfig sets checkJs+strict, so this is a real gate
      - run: bun run test          # scoped to src/ — bare `bun test` also globs e2e/*.spec.js
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - name: End-to-end
        run: |
          bun run dev --port 5188 &
          until curl -sf -o /dev/null http://localhost:5188/; do sleep 1; done
          bunx playwright test
