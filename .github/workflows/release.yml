# Cut a release with release-it + conventional-changelog: bump package.json,
# regenerate CHANGELOG.md, tag, push to main. The tag push is what fires
# docker.yml, which builds the image and bumps helm/values.yaml for ArgoCD.
#
# Anything merged to main cuts a tag, independently of ci — same shape as
# editable-blog and agent-fleet. This was briefly gated on a successful ci run
# instead; that is why paths-ignore below is load-bearing again rather than
# living in a script.
name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # THE loop-breaker. release-it's own release commit touches exactly
    # package.json and CHANGELOG.md, and paths-ignore skips a run only when
    # *every* changed file matches — so that commit, and only that commit, is
    # filtered out. Adding a file to release-it's `assets` without adding it
    # here brings back an infinite release loop.
    # '*.md' not '**.md': root docs only. '**.yaml' also covers docker.yml's
    # helm/values.yaml write-back, which is pushed with GITHUB_TOKEN and cannot
    # trigger anything anyway.
    paths-ignore:
      - '*.md'
      - '**.yml'
      - '**.yaml'
      - 'package.json'
    tags-ignore:
      - '*'

# Not in the sibling repos, and they have a latent bug because of it: two
# releases running at once compute the same version from the same latest tag,
# and the loser's `git push --follow-tags` is rejected non-fast-forward after it
# has already bumped package.json and made a local tag — a release silently lost.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Backstop to paths-ignore above. Redundant while that list is correct, kept
    # because the failure it guards is an infinite release loop rather than a
    # wasted run. head_commit is null on workflow_dispatch, which passes.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release ') }}"
    steps:
      - uses: actions/checkout@v4
        with:
          # conventional-changelog needs the full history and the tags.
          fetch-depth: 0
          # Must be the PAT, not GITHUB_TOKEN: a tag pushed with GITHUB_TOKEN
          # does not fire docker.yml, so the release would land and nothing
          # would ever get built.
          token: ${{ secrets.PAT }}

      - uses: oven-sh/setup-bun@v2

      # --frozen-lockfile errors rather than rewriting bun.lock, and `prepare`
      # only writes gitignored paths, so the tree stays clean for release-it.
      # The siblings' `git reset --hard` fallback is dead code here, and would
      # silently discard whatever dirtied the tree if it ever did fire.
      - run: bun install --frozen-lockfile

      # No GITHUB_TOKEN in env: `github.release: false` disables release-it's
      # GitHub plugin entirely. The token that matters is the checkout one above,
      # persisted into .git/config, which is what pushes the tag.
      - name: Run release-it
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          bun run release
