# Deployed via infra-bootstrap's common-app-chart.
# Registry entry: gitops/apps/registry.yaml -> name: wedding-2026
#
# ingress.hostname is set by the ApplicationSet's Helm parameter and always wins
# over anything written here, so it is deliberately not repeated.

image:
  repository: registry.bnei.lan:5000/wedding-2026
  tag: "0.17.1"

service:
  port: 3000

# REQUIRED, not cosmetic. Traefik terminates TLS and forwards plain HTTP, so
# without this adapter-node computes its origin as http://<pod> and rejects every
# RSVP submission with 403 "Cross-site POST form submissions are forbidden" —
# the browser sends Origin: https://wedding.bnei.dev and they don't match. It
# also restores the https protocol the code uses to decide whether cookies get
# the Secure flag.
#
# Must equal https:// + the registry entry's hostname. The chart renders env with
# toYaml, not tpl, so this cannot reference .Values.ingress.hostname — if the
# hostname ever changes, change it here too.
env:
  - name: ORIGIN
    value: "https://wedding.bnei.dev"

  # REQUIRED for the wall, and silent without it. adapter-node defaults this to
  # 512K (node_modules/@sveltejs/adapter-node/files/handler.js), so every real
  # photo is rejected with a 413 that never reaches app code — no log line from
  # us, nothing in Loki, and it works perfectly in `vite dev`, which uses a
  # different handler entirely. Same class of production-only break as ORIGIN
  # above, which is why it lives next to it. Keep in step with MAX_UPLOAD_BYTES
  # in src/lib/wall.js.
  - name: BODY_SIZE_LIMIT
    value: "12M"

  # Garage, over the LAN. The pod is the ONLY thing that talks to object storage
  # for this app — uploads arrive as a multipart POST and wall images are served
  # back through /api/wall/img — so the bytes never leave the LAN and storage
  # has no dependency on Cloudflare or the home uplink.
  - name: S3_ENDPOINT
    value: "http://garage.bnei.lan:3900"
  - name: S3_BUCKET
    value: "wedding-wall"
  # LOAD-BEARING. Bun's S3 client signs SigV4 with region "auto" by default;
  # Garage is configured with s3_region = "garage" (see
  # ansible/playbooks/garage-configure.yml) and rejects any other scope with
  # AuthorizationHeaderMalformed — on every put AND every get, with an error
  # that reads like a bad key rather than a bad region.
  - name: S3_REGION
    value: "garage"

# wedding.bnei.dev is one label deep, so the proxied *.bnei.dev record and the
# le-dns wildcard default cert already cover it. Nothing to do at Cloudflare.
# Baseline middlewares (Cloudflare origin lock, rate limit, security headers)
# stay at their defaults because the record is proxied.
ingress:
  enabled: true
  certResolver: le

infisical:
  enabled: true
  # Project 798540d3-0c3e-47ee-b447-468d65088377. Holds WEDDING_DB_* and
  # OPENAI_{API_KEY,BASE_URL,MODEL}. universal-auth-credentials needs an access
  # grant to this project in the Infisical UI — a missing grant surfaces as the
  # pod crash-looping on an absent WEDDING_DB_HOST, not as an auth error.
  projectSlug: "wedding-2026-ih1x"
  envSlug: dev
  # DB credentials and the LLM endpoint arrive as env vars, so a rotation needs a
  # restart to take — without this the pod silently keeps the old value.
  autoReload: true

livenessProbe:
  enabled: true
  type: http
  path: /healthz
  port: 3000
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  type: http
  path: /healthz
  port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# 512Mi was fine for a page and a chatbot. The wall decodes images in-process,
# and MAX_PIXELS (src/lib/wall.js) allows 60 MP — about 240 MB of RGBA — with up
# to three decodes in flight. An OOMKill here takes the invitation and the
# chatbot down with the wall, on the one evening that cannot be repeated.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 1Gi

# No PVC: all state lives in Pigsty.

extraManifests:
  # weding.bnei.dev -> wedding.bnei.dev. The wildcard DNS record and certificate
  # already cover the typo host, so this only needs a router and a redirect.
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: {{ .Release.Name }}-typo-redirect
      namespace: {{ .Release.Namespace }}
    spec:
      redirectRegex:
        regex: "^https://weding\\.bnei\\.dev/(.*)"
        replacement: "https://wedding.bnei.dev/${1}"
        permanent: true
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: {{ .Release.Name }}-typo
      namespace: {{ .Release.Namespace }}
    spec:
      entryPoints:
        - websecure
      routes:
        - kind: Rule
          match: Host(`weding.bnei.dev`)
          # Deliberately without the baseline chain (origin lock, rate limit,
          # security headers): this router has no backend to protect — it only
          # emits a 301 and never reaches the app. The real host carries the
          # full baseline.
          middlewares:
            - name: {{ .Release.Name }}-typo-redirect
          services:
            # The redirect fires before the backend is reached; the service
            # reference only has to resolve so Traefik will build the router.
            - kind: Service
              name: {{ .Release.Name }}
              port: {{ .Values.service.port }}
      tls:
        certResolver: {{ .Values.ingress.certResolver }}

  # /admin — the RSVP list. Its own route because the gate is path-scoped: the
  # chart's IngressRoute matches Host() alone and carries no auth, which is what
  # keeps the invitation itself public.
  #
  # TWO THINGS HERE WILL SERVE THE GUEST LIST TO THE INTERNET IF GOT WRONG.
  #
  # 1. `priority`. Traefik's default priority is the RULE LENGTH, so
  #    Host(`wedding.bnei.dev`) scores around 26 on its own. Setting a tidy
  #    small number here would put this route BELOW the chart's and every
  #    /admin request would be served by the unauthenticated one, with a 200.
  #    ADR-0039 Decision 5 requires the priority be explicit rather than
  #    inherited from rule length; it also has to be comfortably higher.
  #
  # 2. The three baseline middlewares are repeated by hand. common-app-chart's
  #    values.yaml states the limitation outright: the baseline chain is
  #    prepended only to the IngressRoute the CHART renders, and any route
  #    declared through extraManifests must wire the refs itself. Without them
  #    /admin sits outside the Cloudflare origin lock — the one thing stopping
  #    a direct connection to 82.65.231.50 with a forged Host header. Order is
  #    cheapest-rejection-first, auth last.
  #
  # authentik-forwardauth lives in `default` and is shared; see
  # infra-bootstrap's gitops/bootstrap/authentik-forwardauth-middleware.yaml.
  # This app is its first consumer. If sign-in loops, the suspect is authentik's
  # Base URL system setting, which proxy providers build redirect URLs from —
  # see docs/runbook-authentik-identity.md §8.
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: {{ .Release.Name }}-admin
      namespace: {{ .Release.Namespace }}
    spec:
      entryPoints:
        - websecure
      routes:
        - kind: Rule
          match: Host(`{{ .Values.ingress.hostname }}`) && PathPrefix(`/admin`)
          priority: 100
          middlewares:
            - name: {{ .Release.Name }}-baseline-originlock
              namespace: {{ .Release.Namespace }}
            - name: {{ .Release.Name }}-baseline-ratelimit
              namespace: {{ .Release.Namespace }}
            - name: {{ .Release.Name }}-baseline-headers
              namespace: {{ .Release.Namespace }}
            - name: authentik-forwardauth
              namespace: default
          services:
            - kind: Service
              name: {{ .Release.Name }}
              port: {{ .Values.service.port }}
      tls:
        certResolver: {{ .Values.ingress.certResolver }}

logAlerts:
  enabled: true
  datasourceUid: ds-loki
  rules:
    # Both of the wall's silent degradations. Moderation failing means photos
    # pile up pending and the projector shows nothing new; there is no other
    # signal that this is happening, and nobody will be reading logs.
    - uid: wedding-wall-moderation
      title: Wedding wall moderation failing
      expr: 'sum(count_over_time({namespace="wedding-2026"} |= "[wall] moderation failed" [10m]))'
      threshold: 3
      for: 5m
      severity: warning
    - uid: wedding-provider-errors
      title: Wedding chatbot provider failing
      expr: 'sum(count_over_time({namespace="wedding-2026"} |= "[chat] provider call failed" [10m]))'
      threshold: 3
      for: 10m
      severity: warning
