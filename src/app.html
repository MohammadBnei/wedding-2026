<!doctype html>
<html lang="%lang%" dir="%dir%" data-theme="%theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Mirrors --color-primary-surface in app.css. One of four places a colour
		     lives outside the token layer, because none of them can read CSS —
		     see the list in app.css. -->
		<meta name="theme-color" content="#1e2159" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
